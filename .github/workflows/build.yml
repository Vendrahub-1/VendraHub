name: VendraHub Next.js verification

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendrahub-next-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextjs-build:
    name: TypeScript and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cloudflare vinext compatibility audit
        run: npx --yes vinext check

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build
